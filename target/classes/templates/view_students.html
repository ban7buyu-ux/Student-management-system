<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Students - Admin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        Student Directory
        <a th:href="@{/admin_dashboard}" class="logout-header-btn">
            <i class="fa-solid fa-arrow-left"></i> Admin Home
        </a>
    </header>

    <div class="container">
        <div class="content-card">
            <h2 style="color: var(--primary-red); margin-top: 0; border-bottom: 2px solid var(--text-blue); padding-bottom: 10px;">Registered Students</h2>
            
            <!-- Search Bar -->
            <form th:action="@{/view_students}" method="GET" style="margin-bottom: 20px; display: flex; gap: 10px;">
                <input type="text" name="query" th:value="${searchQuery}" placeholder="Search by name or email..." 
                       style="flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 5px;">
                <button type="submit" class="login-btn" style="width: auto; padding: 10px 20px; margin-top: 0; background: var(--secondary-blue);">
                    <i class="fa-solid fa-magnifying-glass"></i> Search
                </button>
                <a th:if="${searchQuery}" th:href="@{/view_students}" style="padding: 10px; color: var(--primary-red); text-decoration: none; align-self: center; font-weight: bold;">
                    <i class="fa-solid fa-times"></i> Clear
                </a>
            </form>

            <table>
                <tr>
                    <th style="font-weight: bold;">Name</th>
                    <th style="font-weight: bold;">Email</th>
                    <th style="font-weight: bold;">Department</th>
                    <th style="font-weight: bold;">Year</th>
                </tr>
                <tr th:each="student : ${students}">
                    <td th:text="${student.name}">Banu Rekha</td>
                    <td th:text="${student.email}">banurekha@veltech.edu.in</td>
                    <td th:text="${student.department}">CSE</td>
                    <td th:text="${student.year}">4th Year</td>
                </tr>
                <tr th:if="${#lists.isEmpty(students)}">
                    <td colspan="4" style="text-align: center; color: #999;">No students registered yet.</td>
                </tr>
            </table>

        </div>
    </div>
</body>
</html>
