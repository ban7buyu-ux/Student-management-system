<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Noticeboard - Admin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        University Notice Board Manager
        <a th:href="@{/admin_dashboard}" class="logout-header-btn">
            <i class="fa-solid fa-arrow-left"></i> Dashboard
        </a>
    </header>

    <div class="container">
        <div class="content-card">
            <h2 style="color: var(--primary-red); margin-top: 0; border-bottom: 2px solid var(--text-blue); padding-bottom: 10px;">Post New Announcement</h2>
            
            <form th:action="@{/PostNoticeServlet}" method="POST" style="margin-top: 20px;">
                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 8px; font-weight: bold;">Announcement Title:</label>
                    <input type="text" name="title" class="login-input" style="width: 100%;" placeholder="e.g. Exam Schedule Published" required>
                </div>
                <div style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 8px; font-weight: bold;">Message:</label>
                    <textarea name="message" rows="5" class="login-input" style="width: 100%; padding: 15px; border-radius: 8px;" placeholder="Enter details..." required></textarea>
                </div>
                <button type="submit" class="login-btn">POST ANNOUNCEMENT</button>
            </form>
        </div>

        <div class="content-card" style="margin-top: 25px;">
            <h2 style="color: var(--primary-red); margin-top: 0; border-bottom: 2px solid var(--text-blue); padding-bottom: 10px;">Previous Announcements</h2>
            
            <div th:each="notice : ${notices}" style="background-color: #f8f9fa; padding: 20px; border-radius: 10px; border-left: 5px solid var(--accent-blue); margin-bottom: 20px;">
                <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                    <strong style="color: var(--text-blue);" th:text="${notice.title}">Title</strong>
                    <span style="font-size: 12px; color: #999;" th:text="${notice.post_date}">Date</span>
                </div>
                <p style="margin: 0; line-height: 1.5; color: #555;" th:text="${notice.message}">Message content</p>
            </div>

            <div th:if="${#lists.isEmpty(notices)}" style="text-align: center; padding: 40px;">
                <p style="color: #999;">No announcements posted yet.</p>
            </div>

        </div>
    </div>
</body>
</html>
