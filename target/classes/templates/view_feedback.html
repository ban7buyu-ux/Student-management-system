<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Feedback - Admin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        Student Feedback Inbox
        <a th:href="@{/admin_dashboard}" class="logout-header-btn">
            <i class="fa-solid fa-arrow-left"></i> Dashboard
        </a>
    </header>

    <div class="container">
        <div class="content-card">
            <h2 style="color: var(--primary-red); margin-top: 0; border-bottom: 2px solid var(--text-blue); padding-bottom: 10px;">Submitted Feedback</h2>
            
            <div th:each="feedback : ${feedbackList}" style="background-color: #f8f9fa; padding: 20px; border-radius: 10px; border-left: 5px solid var(--primary-red); margin-bottom: 20px;">
                <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                    <strong style="color: var(--text-blue);" th:text="${feedback.email}">banurekha@veltech.edu.in</strong>
                    <span style="font-size: 12px; color: #999;">Submitted: Recent</span>
                </div>
                <p style="margin: 0; line-height: 1.5; color: #555;" th:text="${feedback.message}">This is a sample feedback message.</p>
            </div>

            <div th:if="${#lists.isEmpty(feedbackList)}" style="text-align: center; padding: 40px;">
                <i class="fa-solid fa-comments-slash" style="font-size: 48px; color: #ddd; margin-bottom: 20px;"></i>
                <p style="color: #999;">No feedback submitted by students yet.</p>
            </div>

        </div>
    </div>
</body>
</html>
